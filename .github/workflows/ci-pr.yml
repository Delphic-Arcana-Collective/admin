# PR to main: lint, compile, and test.
# Push to main: the same checks, then build and push the image.
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Install golangci-lint (built with project Go toolchain)
        working-directory: backend
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1

      - name: Run golangci-lint
        working-directory: backend
        run: golangci-lint run --verbose --timeout 10m ./...

  proto-lint:
    name: proto-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: buf lint
        uses: bufbuild/buf-action@v1
        with:
          input: backend/proto
          lint: true
          format: false
          breaking: false

  go-test:
    name: go-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Setup buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: buf generate
        run: buf generate
        working-directory: backend/proto

      - name: Verify go.mod is tidy
        working-directory: backend
        run: |
          go mod tidy
          git diff --exit-code

      - name: go build
        working-directory: backend
        run: go build -o /dev/null ./cmd/admin

      - name: Run tests
        working-directory: backend
        run: go test ./...

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm build

  docker:
    name: docker
    needs:
      - golangci-lint
      - proto-lint
      - go-test
      - frontend-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image tags
        id: meta
        run: |
          short_sha="$(git rev-parse --short HEAD)"
          repo="${{ secrets.DOCKER_USERNAME }}/delphic-admin"
          {
            echo "tags=${repo}:latest,${repo}:${short_sha}"
          } >> "$GITHUB_OUTPUT"
          echo "Pushing ${repo}:latest and ${repo}:${short_sha}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
