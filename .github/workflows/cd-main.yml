# push main (after PR merge): build artifacts on GitHub, deploy on self-hosted.
name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    name: backend-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Setup buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: buf generate
        run: buf generate
        working-directory: backend/proto

      - name: Run tests
        working-directory: backend
        run: go test ./...

      - name: Build backend binary
        working-directory: backend
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o delphic_admin ./cmd/admin

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: backend/delphic_admin
          retention-days: 1

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-out
          path: frontend/out/
          retention-days: 1

  deploy:
    name: deploy
    needs:
      - backend-build
      - frontend-build
    runs-on: [self-hosted, linux, delphic-admin]
    timeout-minutes: 15
    env:
      DEPLOY_PATH: /usr/local/delphic-admin
    steps:
      - uses: actions/checkout@v6

      - name: Prepare deploy directory
        run: |
          sudo mkdir -p "${DEPLOY_PATH}/backend/public"
          sudo chown -R "$(whoami):" "${DEPLOY_PATH}"

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: ${{ env.DEPLOY_PATH }}/backend/public

      - name: Stop backend before binary update
        run: sudo systemctl stop delphic-admin || true

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-binary
          path: ${{ env.DEPLOY_PATH }}/backend

      - name: Deploy
        run: bash scripts/ci-deploy.bash
