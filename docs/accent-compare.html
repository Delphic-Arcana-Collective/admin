<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>粉色对照 · NFC 链接生成器</title>
  <style>
    :root {
      --ink: #1a1a1a;
      --control: #4b5563;
      --line: #e5e7eb;
      --panel: #f9fafb;
      --page: #f3f4f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      gap: 16px;
      align-items: center;
      padding: 16px 20px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    header img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 8px;
      background: #111;
    }
    header h1 { margin: 0 0 4px; font-size: 16px; }
    header p { margin: 0; color: var(--control); font-size: 12px; line-height: 1.5; }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      padding: 16px;
    }
    article {
      background: #fff;
      border: 1px solid var(--line);
      padding: 16px;
    }
    .meta { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 12px; }
    .meta strong { font-size: 14px; }
    .meta span, .note { color: var(--control); font-size: 12px; }
    .swatch { width: 100%; height: 28px; margin: 8px 0 12px; border: 1px solid var(--line); }
    h2 { margin: 0 0 12px; font-size: 20px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tabs button, .go {
      border: 0;
      cursor: pointer;
      font: inherit;
    }
    .tabs button {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      font-size: 14px;
    }
    .card { border: 1px solid var(--line); padding: 20px; min-height: 260px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; }
    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--control);
      font: inherit;
      font-size: 14px;
    }
    .row { margin-top: 16px; }
    .switch {
      width: 56px;
      height: 28px;
      border: 0;
      border-radius: 999px;
      position: relative;
      cursor: pointer;
      background: #e5e7eb;
    }
    .switch i {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: #fff;
    }
    .switch.on i { left: 30px; }
    .go {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      font-size: 14px;
    }
    .out {
      margin-top: 12px;
      padding: 8px 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      font-size: 12px;
      word-break: break-all;
    }
  </style>
</head>

    <div>
      <h1>挑一个粉色</h1>
      <p>粉色对照，主题色定为抚子粉 #F6ADC6，次选樱花 #FFB7C5，其余候选留存。</p>
    </div>
  </header>
  <main id="board"></main>
  <script>
    const options = [
      { name: "现在", hex: "#F3B6C0", note: "当前主题" },
      { name: "Cameo Pink", hex: "#EFBBCC", note: "ISCC-NBS，靠近头发、稍干净" },
      { name: "抚子粉", hex: "#F6ADC6", note: "Nadeshiko，日式甜粉" },
      { name: "Mauvelous", hex: "#F091A9", note: "Crayola，鲜一点的粉彩" },
      { name: "樱花", hex: "#FFB7C5", note: "樱花色，偏亮，用来看上限" }
    ];

    const board = document.querySelector("#board");
    for (const option of options) {
      const article = document.createElement("article");
      article.innerHTML = `
        <div class="meta"><strong>${option.name}</strong><span>${option.hex}</span></div>
        <div class="note">${option.note}</div>
        <div class="swatch" style="background:${option.hex}"></div>
        <h2>NFC 链接生成器</h2>
        <div class="tabs">
          <button type="button" data-tab="0">QQ</button>
          <button type="button" data-tab="1">Discord</button>
        </div>
        <div class="card">
          <label>ID</label>
          <input type="text" placeholder="请输入您的 ID" />
          <div class="row group">
            <label>群组</label>
            <button type="button" class="switch" aria-label="群组"><i></i></button>
          </div>
          <button type="button" class="go">生成</button>
          <div class="out" hidden></div>
        </div>
      `;
      const paint = (tab, on) => {
        const buttons = article.querySelectorAll("[data-tab]");
        buttons.forEach((button) => {
          const active = Number(button.dataset.tab) === tab;
          button.style.background = active ? option.hex : "#f9fafb";
          button.style.color = active ? "#1a1a1a" : "#4b5563";
        });
        const switcher = article.querySelector(".switch");
        switcher.style.background = on ? option.hex : "#e5e7eb";
        switcher.classList.toggle("on", on);
        article.querySelector(".go").style.background = option.hex;
        article.querySelector(".go").style.color = "#1a1a1a";
        article.querySelector(".group").hidden = tab !== 0;
      };
      let tab = 0;
      let on = false;
      paint(tab, on);
      article.querySelectorAll("[data-tab]").forEach((button) => {
        button.addEventListener("click", () => {
          tab = Number(button.dataset.tab);
          paint(tab, on);
        });
      });
      article.querySelector(".switch").addEventListener("click", () => {
        on = !on;
        paint(tab, on);
      });
      article.querySelector(".go").addEventListener("click", () => {
        const id = article.querySelector("input").value.trim();
        const out = article.querySelector(".out");
        if (!id) {
          out.hidden = false;
          out.textContent = "请输入 ID";
          return;
        }
        const url = tab === 0
          ? `mqqapi://card/show_pslcard?src_type=internal&version=1&uin=${id}&card_type=${on ? "group" : "person"}&source=qrcode`
          : `https://discord.com/users/${id}`;
        out.hidden = false;
        out.textContent = url;
      });
      board.append(article);
    }
  </script>
