syntax = "proto3";

package calendar.v1;

option go_package = "processDelphicData/proto/api/calendar/v1;calendarv1";

service CalendarService {
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  rpc GetEvent(GetEventRequest) returns (GetEventResponse);
  rpc ListEventsByDate(ListEventsByDateRequest) returns (ListEventsResponse);
  rpc GetEventStats(GetEventStatsRequest) returns (GetEventStatsResponse);
  rpc CreateEvent(CreateEventRequest) returns (CreateEventResponse);
  rpc UpdateEvent(UpdateEventRequest) returns (UpdateEventResponse);
  rpc DeleteEvent(DeleteEventRequest) returns (DeleteEventResponse);
  rpc BatchCreateEvents(BatchCreateEventsRequest) returns (BatchCreateEventsResponse);
}

message CalendarEvent {
  uint32 id = 1;
  string date = 2;
  string title = 3;
  string description = 4;
  string event_type = 5;
  string status = 6;
  string priority = 7;
  bool all_day = 8;
  string start_time = 9;
  string end_time = 10;
  string color = 11;
  string created_at = 12;
  string updated_at = 13;
}

message ListEventsRequest {
  string start_date = 1;
  string end_date = 2;
  string event_type = 3;
  string status = 4;
}

message ListEventsResponse {
  repeated CalendarEvent events = 1;
}

message GetEventRequest {
  uint32 id = 1;
}

message GetEventResponse {
  CalendarEvent event = 1;
}

message ListEventsByDateRequest {
  string date = 1;
}

message GetEventStatsRequest {}

message GetEventStatsResponse {
  int64 total = 1;
  map<string, int64> status_counts = 2;
  map<string, int64> type_counts = 3;
}

message CreateEventRequest {
  CalendarEvent event = 1;
}

message CreateEventResponse {
  CalendarEvent event = 1;
}

message UpdateEventRequest {
  uint32 id = 1;
  CalendarEvent event = 2;
}

message UpdateEventResponse {
  CalendarEvent event = 1;
}

message DeleteEventRequest {
  uint32 id = 1;
}

message DeleteEventResponse {
  string message = 1;
}

message BatchCreateEventsRequest {
  repeated CalendarEvent events = 1;
}

message BatchCreateEventsResponse {
  repeated CalendarEvent events = 1;
}
