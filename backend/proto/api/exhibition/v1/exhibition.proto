syntax = "proto3";

package exhibition.v1;

option go_package = "processDelphicData/proto/api/exhibition/v1;exhibitionv1";

service ExhibitionService {
  rpc ListExhibitions(ListExhibitionsRequest) returns (ListExhibitionsResponse);
  rpc GetExhibition(GetExhibitionRequest) returns (GetExhibitionResponse);
  rpc GetExhibitionStats(GetExhibitionStatsRequest) returns (GetExhibitionStatsResponse);
  rpc CreateExhibition(CreateExhibitionRequest) returns (CreateExhibitionResponse);
  rpc UpdateExhibition(UpdateExhibitionRequest) returns (UpdateExhibitionResponse);
  rpc DeleteExhibition(DeleteExhibitionRequest) returns (DeleteExhibitionResponse);
  rpc ExtractFromImage(ExtractFromImageRequest) returns (ExtractFromImageResponse);
}

message File {
  uint32 id = 1;
  bytes data = 2;
  string ext = 3;
  string mime_type = 4;
  string created_at = 5;
}

message ExhibitionAttachment {
  uint32 id = 1;
  uint32 exhibition_id = 2;
  uint32 file_id = 3;
  File file = 4;
}

message Exhibition {
  uint32 id = 1;
  string region = 2;
  string name = 3;
  string start_date = 4;
  string end_date = 5;
  string location = 6;
  string type = 7;
  string booth_fee = 8;
  string contact = 9;
  string remark = 10;
  string status = 11;
  optional uint32 cover_image_id = 12;
  File cover_image = 13;
  string description = 14;
  string link = 15;
  repeated ExhibitionAttachment attachments = 16;
  string created_at = 17;
}

message ListExhibitionsRequest {
  string region = 1;
  string status = 2;
}

message ListExhibitionsResponse {
  repeated Exhibition exhibitions = 1;
}

message GetExhibitionRequest {
  uint32 id = 1;
}

message GetExhibitionResponse {
  Exhibition exhibition = 1;
}

message GetExhibitionStatsRequest {}

message GetExhibitionStatsResponse {
  int64 total = 1;
  map<string, int64> status_counts = 2;
  map<string, int64> region_counts = 3;
}

message CreateExhibitionRequest {
  string region = 1;
  string name = 2;
  string start_date = 3;
  string end_date = 4;
  string location = 5;
  string type = 6;
  string booth_fee = 7;
  string contact = 8;
  string remark = 9;
  string status = 10;
  string description = 11;
  string link = 12;
  optional uint32 cover_image_id = 13;
  repeated uint32 attachment_ids = 14;
}

message CreateExhibitionResponse {
  Exhibition exhibition = 1;
}

message UpdateExhibitionRequest {
  uint32 id = 1;
  string region = 2;
  string name = 3;
  string start_date = 4;
  string end_date = 5;
  string location = 6;
  string type = 7;
  string booth_fee = 8;
  string contact = 9;
  string remark = 10;
  string status = 11;
  string description = 12;
  string link = 13;
  bool update_cover_image = 14;
  optional uint32 cover_image_id = 15;
  bool replace_attachments = 16;
  repeated uint32 attachment_ids = 17;
}

message UpdateExhibitionResponse {
  Exhibition exhibition = 1;
}

message DeleteExhibitionRequest {
  uint32 id = 1;
}

message DeleteExhibitionResponse {
  string message = 1;
}

message ExtractedExhibition {
  string name = 1;
  string region = 2;
  string location = 3;
  string type = 4;
  string start_date = 5;
  string end_date = 6;
  string booth_fee = 7;
  string contact = 8;
  string description = 9;
  string link = 10;
  string remark = 11;
  string status = 12;
}

message ExtractFromImageRequest {
  uint32 file_id = 1;
}

message ExtractFromImageResponse {
  ExtractedExhibition data = 1;
}
